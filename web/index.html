<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>code-bot</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e8ee; --muted: #8b93a7;
    --accent: #4f8cff; --green: #2fbf71; --amber: #f0a43a; --red: #ef5350;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
          background: var(--line); color: var(--muted); text-transform: uppercase; }
  .pill.running { background: rgba(47,191,113,.15); color: var(--green); }
  .pill.paused, .pill.break, .pill.starting { background: rgba(240,164,58,.15); color: var(--amber); }
  .pill.stopped { background: rgba(239,83,80,.12); color: var(--red); }
  .spacer { flex: 1; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
             margin: 0 0 12px; font-weight: 600; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; font-weight: 600; border: 1px solid var(--line); background: #1f2430;
           color: var(--text); padding: 9px 16px; border-radius: 8px; cursor: pointer; }
  button:hover { border-color: #3a4152; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--red); border-color: var(--red); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { background: #12151b; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 4px; }
  input[type=number], input[type=text], select {
    width: 100%; background: #12151b; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font: inherit; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top: 10px; }
  .checks label { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 13px; margin: 0; }
  .langs { display: flex; flex-wrap: wrap; gap: 6px; }
  .langs label { display: inline-flex; align-items: center; gap: 6px; margin: 0; padding: 5px 10px;
                 border: 1px solid var(--line); border-radius: 999px; color: var(--text); cursor: pointer; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg label { flex: 1; margin: 0; text-align: center; padding: 8px; cursor: pointer; color: var(--text); }
  .seg input { display: none; }
  .seg input:checked + span { color: var(--accent); font-weight: 700; }
  pre.log { margin: 0; height: 220px; overflow: auto; background: #0b0d11; border: 1px solid var(--line);
            border-radius: 8px; padding: 10px; font: 12px/1.5 ui-monospace, Consolas, monospace; color: #b8c0d4; }
  .muted { color: var(--muted); font-size: 12px; }
  kbd { background: #1f2430; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 11px; }
  .full { grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>code-bot</h1>
    <span id="state" class="pill">idle</span>
    <div class="spacer"></div>
    <span class="muted"><kbd>F9</kbd> pause · <kbd>F10</kbd>/<kbd>Esc</kbd> stop · mouse to top-left = emergency stop</span>
  </header>

  <div class="grid">
    <section class="card full">
      <div class="controls">
        <button id="start" class="primary">▶ Start</button>
        <button id="pause">❚❚ Pause</button>
        <button id="stop" class="danger">■ Stop</button>
        <button id="openEditor">Open Notepad</button>
        <div class="spacer"></div>
        <span class="muted" id="info"></span>
      </div>
      <div class="stats" style="margin-top:14px">
        <div class="stat"><b id="s_uptime">0:00</b><span>uptime</span></div>
        <div class="stat"><b id="s_chars">0</b><span>characters typed</span></div>
        <div class="stat"><b id="s_lines">0</b><span>lines</span></div>
        <div class="stat"><b id="s_mouse">0</b><span>mouse moves</span></div>
        <div class="stat"><b id="s_snippets">0</b><span>snippets</span></div>
        <div class="stat"><b id="s_typos">0</b><span>typos fixed</span></div>
        <div class="stat"><b id="s_lang">–</b><span>language</span></div>
        <div class="stat"><b id="s_left">∞</b><span>time left</span></div>
      </div>
    </section>

    <section class="card">
      <h2>Behavior</h2>
      <div class="seg">
        <label><input type="radio" name="mode" value="both"><span>Mouse + typing</span></label>
        <label><input type="radio" name="mode" value="mouse"><span>Mouse only</span></label>
        <label><input type="radio" name="mode" value="type"><span>Typing only</span></label>
      </div>
      <label>Typing speed: <b id="wpmv"></b> WPM</label>
      <input type="range" id="wpm" min="10" max="150" step="5">
      <label>Typo rate: <b id="typov"></b>%</label>
      <input type="range" id="typo_rate" min="0" max="10" step="0.5">
      <div class="row">
        <div><label>Mouse pause min (s)</label><input type="number" id="mouse_min" min="0.2" step="0.5"></div>
        <div><label>Mouse pause max (s)</label><input type="number" id="mouse_max" min="0.2" step="0.5"></div>
      </div>
      <div class="row">
        <div><label>Auto-stop after (min, 0 = never)</label><input type="number" id="minutes" min="0" step="5"></div>
        <div><label>Clear file every N lines (0 = never)</label><input type="number" id="clear_after_lines" min="0" step="10"></div>
      </div>
      <div class="checks">
        <label><input type="checkbox" id="scroll"> Random scrolling</label>
        <label><input type="checkbox" id="breaks"> Short random breaks</label>
        <label><input type="checkbox" id="auto_open_editor"> Auto-open Notepad</label>
        <label><input type="checkbox" id="keep_focus"> Keep Notepad focused</label>
        <label><input type="checkbox" id="strip_indent"> Editor auto-indents</label>
      </div>
    </section>

    <section class="card">
      <h2>Code to type</h2>
      <div class="langs" id="langs"></div>
      <label>…or type your own file (full path, optional)</label>
      <input type="text" id="custom_file" placeholder="C:\Users\me\projects\app\main.py">
      <label>Start delay (seconds)</label>
      <input type="number" id="start_delay" min="0" step="1">
      <p class="muted">The bot types into its own scratch file (<code id="scratch"></code>), never into your real notes.</p>
    </section>

    <section class="card full">
      <h2>Log</h2>
      <pre class="log" id="log"></pre>
    </section>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let languages = [];

function fmt(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
}

function readForm() {
  return {
    mode: document.querySelector("input[name=mode]:checked")?.value || "both",
    wpm: +$("wpm").value,
    typo_rate: +$("typo_rate").value / 100,
    mouse_min: +$("mouse_min").value,
    mouse_max: +$("mouse_max").value,
    minutes: +$("minutes").value,
    clear_after_lines: +$("clear_after_lines").value,
    scroll: $("scroll").checked,
    breaks: $("breaks").checked,
    auto_open_editor: $("auto_open_editor").checked,
    keep_focus: $("keep_focus").checked,
    strip_indent: $("strip_indent").checked,
    languages: [...document.querySelectorAll("#langs input:checked")].map((i) => i.value),
    custom_file: $("custom_file").value.trim(),
    start_delay: +$("start_delay").value,
  };
}

function fillForm(c) {
  const m = document.querySelector(`input[name=mode][value=${c.mode}]`); if (m) m.checked = true;
  $("wpm").value = c.wpm; $("wpmv").textContent = c.wpm;
  $("typo_rate").value = (c.typo_rate * 100).toFixed(1); $("typov").textContent = (c.typo_rate * 100).toFixed(1);
  for (const k of ["mouse_min", "mouse_max", "minutes", "clear_after_lines", "start_delay", "custom_file"]) $(k).value = c[k];
  for (const k of ["scroll", "breaks", "auto_open_editor", "keep_focus", "strip_indent"]) $(k).checked = !!c[k];
  $("langs").innerHTML = languages.map((l) =>
    `<label><input type="checkbox" value="${l}" ${c.languages.includes(l) ? "checked" : ""}> ${l}</label>`).join("");
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}

function render(st) {
  const state = st.state;
  $("state").textContent = state; $("state").className = "pill " + state;
  $("start").disabled = st.running;
  $("stop").disabled = !st.running;
  $("pause").disabled = !st.running || state === "starting";
  $("pause").textContent = state === "paused" ? "▶ Resume" : "❚❚ Pause";
  const s = st.stats;
  $("s_uptime").textContent = fmt(s.uptime);
  $("s_chars").textContent = s.chars.toLocaleString();
  $("s_lines").textContent = s.lines.toLocaleString();
  $("s_mouse").textContent = s.mouse_moves.toLocaleString();
  $("s_snippets").textContent = s.snippets;
  $("s_typos").textContent = s.typos;
  $("s_lang").textContent = s.language || "–";
  $("s_left").textContent = s.ends_at && st.running ? fmt(s.ends_at - Date.now() / 1000) : "∞";
  $("scratch").textContent = st.scratch_file;
  $("info").textContent = st.editor ? "Editor: " + st.editor : "";
  const log = $("log"); const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 10;
  log.textContent = st.logs.join("\n");
  if (atBottom) log.scrollTop = log.scrollHeight;
}

async function poll() {
  try { render(await api("/api/status")); } catch { $("state").textContent = "offline"; $("state").className = "pill stopped"; }
}

$("wpm").oninput = () => $("wpmv").textContent = $("wpm").value;
$("typo_rate").oninput = () => $("typov").textContent = $("typo_rate").value;
$("start").onclick = async () => render((await api("/api/start", readForm())).status);
$("stop").onclick = async () => render((await api("/api/stop", {})).status);
$("pause").onclick = async () => {
  const resume = $("pause").textContent.includes("Resume");
  render((await api(resume ? "/api/resume" : "/api/pause", {})).status);
};
$("openEditor").onclick = () => api("/api/open-editor", {});
document.addEventListener("change", (e) => { if (e.target.closest(".card")) api("/api/settings", readForm()); });

(async () => {
  const s = await api("/api/settings");
  languages = s.languages; fillForm(s.config);
  poll(); setInterval(poll, 1000);
})();
</script>
</body>
</html>
